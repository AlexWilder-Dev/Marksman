<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marksman Public House</title>
    <!--head-meta-->
    <meta name="theme-color" content="#F3EDE3" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preload" href="./fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/caslon.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('./fonts/fraunces.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces';
        font-style: italic;
        font-weight: 300 700;
        font-display: swap;
        src: url('./fonts/fraunces-italic.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Libre Caslon Text';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/caslon.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Libre Caslon Text';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/caslon-italic.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Libre Caslon Text';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/caslon-bold.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Cabin';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('./fonts/cabin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Metric-matched fallbacks so the swap to web fonts does not shift layout. */
      @font-face {
        font-family: 'Fraunces Fallback';
        src: local('Times New Roman'), local('TimesNewRomanPSMT'), local('Liberation Serif'), local('Times');
        size-adjust: 110.4%;
        ascent-override: 88.6%;
        descent-override: 23.1%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Caslon Fallback';
        src: local('Times New Roman'), local('TimesNewRomanPSMT'), local('Liberation Serif'), local('Times');
        size-adjust: 116%;
        ascent-override: 83.5%;
        descent-override: 22.4%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Cabin Fallback';
        src: local('Arial Narrow'), local('Arial'), local('Liberation Sans'), local('Helvetica');
        size-adjust: 86.5%;
        ascent-override: 111.5%;
        descent-override: 28.9%;
        line-gap-override: 0%;
      }
      html { background: #f3ede3; }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
